<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flauta - Bot de Fútbol</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-container">
    <!-- Encabezado del Chat -->
    <header class="chat-header">
      <div class="bot-avatar">⚽</div>
      <div class="bot-info">
        <h1>Flauta</h1>
        <span class="status">En línea • Experto en Fútbol</span>
      </div>
    </header>

    <!-- Zona de Chat (Boceto) -->
    <main id="zona-de-chat" class="zona-de-chat" aria-live="polite">
      <!-- Los mensajes del bot y del usuario se insertan dinámicamente aquí -->
    </main>

    <!-- Zona de Opciones (Boceto) -->
    <footer id="zona-de-opciones" class="zona-de-opciones">
      <!-- Los botones de opciones e inputs se cargan dinámicamente aquí -->
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
